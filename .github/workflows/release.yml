name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: windows-latest

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject untagged manual execution
        if: github.ref_type != 'tag'
        shell: pwsh
        run: throw "Execute o workflow em uma tag existente v<SemVer>."

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap-lock.txt
            requirements-build-lock-win-x64.txt

      - name: Install exact dependencies
        shell: pwsh
        run: ./packaging/install.ps1 -BuildTools

      - name: Validate tag and version
        shell: pwsh
        run: |
          $version = (& ./.venv/Scripts/python.exe packaging/generate_version_info.py --print-version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível ler version.py" }
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "A tag $env:GITHUB_REF_NAME não corresponde a version.py ($expected)."
          }

      - name: Test and validate QML
        shell: pwsh
        run: |
          & ./.venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }
          & ./packaging/lint_qml.ps1
          if ($LASTEXITCODE -ne 0) { throw "Validação QML falhou" }

      - name: Build release artifacts
        shell: pwsh
        run: ./packaging/build.ps1 -SkipDependencyInstall

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaProfiles-${{ github.ref_name }}-release
          path: artifacts/NovaProfiles-*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v4
        with:
          name: NovaProfiles-${{ github.ref_name }}-release
          path: artifacts

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem artifacts/NovaProfiles-* -File | Select-Object -ExpandProperty FullName)
          if ($files.Count -ne 3) { throw "Esperados ZIP, SHA-256 e SBOM; encontrados $($files.Count)." }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --generate-notes --title "NovaProfiles $($env:GITHUB_REF_NAME.TrimStart('v'))"
